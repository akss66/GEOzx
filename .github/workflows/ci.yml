name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main-agent-v3-directed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: Complete operations worker contract
        run: uv run pytest -q tests/test_main_agent_worker_contract.py
      - name: Capability, telemetry, safety, and budget contracts
        run: >-
          uv run pytest -q
          tests/test_main_agent_v3_integration.py
          tests/test_main_agent_v3_performance.py
          tests/test_main_agent_performance_contract.py
          tests/test_llm_gateway.py
          tests/test_conversation_api.py
          tests/test_conversation_models.py
          tests/test_migrations.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/check_changed_python_format.py --base "$BASE_SHA"
      - name: Tests (pytest)
        run: uv run pytest -q --durations=25

  migration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dyflow
          POSTGRES_PASSWORD: dyflow_ci_pw
          POSTGRES_DB: dyflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dyflow -d dyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dyflow:dyflow_ci_pw@localhost:5432/dyflow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: PostgreSQL migration up, down, and up
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade 20260804_0450
          uv run alembic upgrade head
      - name: Real PostgreSQL account-lane barriers
        run: uv run pytest -q tests/test_account_execution_lane_postgres.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Main-agent UI contracts
        run: >-
          pnpm exec vitest run --reporter=dot
          src/api/brain.test.ts
          src/components/brain/BrainComposer.test.tsx
          src/pages/BrainHome.test.tsx
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Main-agent bundle budget
        run: pnpm check:main-agent-bundle
      - name: Enforce frontend performance budget
        run: pnpm perf:check

  main-agent-v3-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dyflow
          POSTGRES_PASSWORD: dyflow_ci_pw
          POSTGRES_DB: dyflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dyflow -d dyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dyflow:dyflow_ci_pw@localhost:5432/dyflow
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      MAIN_AGENT_V2_ENABLED: "true"
      MAIN_AGENT_TYPED_RUNTIME_ENABLED: "true"
      LLM_DETERMINISTIC_TEST_PROVIDER_ENABLED: "true"
      ADMIN_EMAIL: ci-admin@example.invalid
      ADMIN_PASSWORD: ci-main-agent-password
      DEFAULT_ORG_NAME: Main Agent V3 CI
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Migrate and seed smoke database
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed
      - name: Start backend and worker with deterministic test provider
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/backend.log 2>&1 &
          uv run arq app.worker.WorkerSettings >/tmp/worker.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log /tmp/worker.log
          exit 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Frontend smoke and reconnect contracts
        run: >-
          pnpm exec playwright test
          main-agent-v2.spec.ts
          main-agent-reconnect.spec.ts
      - name: Real backend worker loop and API smoke
        env:
          REAL_BACKEND_SMOKE: "1"
          REAL_WORKER_LOOP: "1"
          REAL_API_ORIGIN: http://127.0.0.1:8000
          REAL_SMOKE_EMAIL: ci-admin@example.invalid
          REAL_SMOKE_PASSWORD: ci-main-agent-password
        run: >-
          pnpm exec playwright test
          main-agent-worker-loop.spec.ts
          main-agent-real-api.spec.ts
      - name: Upload Playwright and service failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-agent-v3-playwright-failure
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/backend.log
            /tmp/worker.log
            frontend/playwright-report
            frontend/test-results
